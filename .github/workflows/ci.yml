name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/chess-tutor/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, component and contract tests (stub engine)
        run: python -m pytest -m "not engine"

  engine:
    name: Integration tests (real Stockfish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/chess-tutor/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo "STOCKFISH_PATH=/usr/games/stockfish" >> "$GITHUB_ENV"
          /usr/games/stockfish <<< "quit" | head -1
      - name: Tests that run a real engine
        run: python -m pytest -m engine

  plugin:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.263
      - name: Validate plugin.json and marketplace.json
        run: claude plugin validate .

  all-green:
    name: All checks passed
    if: always()
    needs: [test, engine, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "test=${{ needs.test.result }} engine=${{ needs.engine.result }} plugin=${{ needs.plugin.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.engine.result }}" = "success" ] && [ "${{ needs.plugin.result }}" = "success" ]
