name: Release

# Pushing a tag such as v0.1.0 verifies it and publishes a GitHub Release. To cut a release:
#   1. bump "version" in .claude-plugin/plugin.json and .claude-plugin/marketplace.json
#   2. move the CHANGELOG.md notes under a "## [X.Y.Z] - date" heading
#   3. merge to the default branch, then: git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/chess-tutor/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tag, manifests and CHANGELOG must agree
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - name: Tests
        run: python -m pytest -m "not engine"

  publish:
    name: Publish the GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract release notes from CHANGELOG.md
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > release_notes.md
      - name: Build the skills bundle (for copying into .claude/skills/)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=zip --prefix="chess-mentor-skills-${VERSION}/" \
            -o "dist/chess-mentor-skills-${VERSION}.zip" "$GITHUB_REF_NAME" skills LICENSE README.md CHANGELOG.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/chess-mentor-skills-${VERSION}.zip" \
            --title "Chess Mentor ${VERSION}" --notes-file release_notes.md --verify-tag $FLAGS
